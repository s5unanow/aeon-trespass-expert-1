# ATO Core Rulebook v1.1 — the real source document.

[document]
id = "ato_core_v1_1"
source_pdf = "materials/ATO_CORE_Rulebook_v1.1.pdf"
source_lang = "en"
target_langs = ["ru"]

# S5U-747 — Codex CLI provider options for ATO Core's EN->RU translation.
# Inherits flat keys (provider="codex-cli", model_default="gpt-5.5", etc.)
# from configs/base.toml and overlays the Codex-specific knobs here so
# fixture documents that switch ``provider = "mock"`` don't pick these up
# via base inheritance.
[translation.provider_options.cli]
timeout_seconds = 600          # xhigh reasoning takes minutes per page
json_mode = true               # require JSON output; drives `--json` events
reasoning_effort = "xhigh"     # codex-cli only — best translation quality
sandbox = "read-only"          # codex-cli only — adapter is read-only
approval_policy = "never"      # codex-cli only — non-interactive pipeline use

[symbols]
catalog = "configs/symbols/ato_core_v1_1.symbols.toml"

[extraction.layout]
dpi = 200

[render.page_overrides.p0006]
presentation_mode = "facsimile"
title = "Components (continued)"
facsimile_annotations = false

[render.page_overrides.p0007]
presentation_mode = "facsimile"
title = "Components"
facsimile_annotation_keep_texts = [
    "Primordial Sheets",
    "AI Cards",
    "BP Cards",
    "Divider Cards",
    "Secret Envelopes",
    "Argonaut Cards",
    "Pattern Cards",
    "1901 Cards",
    "Card Game",
    "Small Square",
    "Titan Sheets",
    "Storybooks",
    "Moiros Cards",
    "Wound Cards",
    "Secret Cards",
    "Trauma Cards",
]

[render.page_overrides.p0054]
title = "Wounded / Escalation Charts"

# S5U-699 — force article mode for the "Tree of Knowledge" card-reference pages.
# The auto heuristic (hard_page + native_text_coverage < 0.15) mis-classifies
# these as facsimile-only even though structure recovery produces readable
# headings, paragraphs, and tables (44 and 37 non-figure blocks respectively).
# Without this override the reader shows only the raster scan with tiny
# non-selectable text. See the Linear issue for the must-refuse matrix.
[render.page_overrides.p0075]
presentation_mode = "article"
title = "Tree of Knowledge"

[render.page_overrides.p0076]
presentation_mode = "article"
title = "Tree of Knowledge (continued)"

# S5U-699 — the publish-time guard in `scripts/_export_validation.py` also
# detected the same facsimile/structured-payload mismatch on p0040, p0067,
# p0074, and p0082. These were OUT OF SCOPE for S5U-699 (which explicitly
# scoped p0075/p0076) and were temporarily allowlisted as facsimile.
#
# S5U-706 — evaluated each page's realized render payload + the rendered
# reader output (Playwright screenshot of /documents/ato_core_v1_1/en/<pid>).
# The auto heuristic (hard_page + native_text_coverage < threshold) still
# mis-classifies these as facsimile, so the three readable pages get an
# explicit `presentation_mode = "article"` override (removing the override is
# NOT enough — the default for these hard/low-coverage pages is still
# facsimile). p0082 keeps its facsimile override:
#   * p0040 — 2 clean prose paragraphs (movement example) + diagram step
#     callouts. Renders as readable article. -> article.
#   * p0067 — Ranged/Reach/Reflex/Reposition/Reinforce keyword rules, list
#     items, and pushback narrative. Readable article. -> article.
#   * p0074 — Hekaton/Cyclonus level-8+ tile-requirement lists + Burden
#     level-5+ heading. Readable line-level article. -> article.
#   * p0082 — "in-game Symbols" glossary. The source is a multi-column icon
#     legend; structure recovery collapses columns onto single rows
#     ("Danger Attack die Red die Potential" = four distinct symbols) and the
#     inline icons are misaligned to their labels. Article mode renders as
#     scrambled, mis-paired text with no usable icon-to-name grid, so this
#     page stays FACSIMILE (the raster scan preserves the legend layout).
#     Kept in the facsimile allowlist so the S5U-699 publish guard stays green.
[render.page_overrides.p0040]
presentation_mode = "article"

[render.page_overrides.p0067]
presentation_mode = "article"

[render.page_overrides.p0074]
presentation_mode = "article"

[render.page_overrides.p0082]
presentation_mode = "facsimile"

[structure]
# ATO Core uses denser layouts — lower footer threshold
footer_y_threshold = 785.0

# p0054: escalation / wounded-card chart — PyMuPDF misses gridless tables
[structure.page_overrides.p0054]
table_regions = [
    { x0 = 55.0, y0 = 105.0, x1 = 550.0, y1 = 695.0 },
]
