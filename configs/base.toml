# Base configuration — shared defaults for all documents and environments.

artifact_root = "artifacts"

[pipeline]
version = "0.1.0"
parallelism = 4
review_threshold = 0.80

[extraction.native]
engine = "pymupdf"

[extraction.raster]
pyramid_dpi = [150, 300]

[extraction.layout]
primary = "docling"
hard_fallback = "paddleocr"
dpi = 300

[symbols]
match_threshold = 0.93

[translation]
# S5U-747 — Codex CLI is the recommended primary translation provider for
# best-quality EN -> RU rulebook translation; Gemini CLI remains the
# documented fallback so a Codex outage doesn't block a build. Real
# documents (e.g. ``configs/documents/ato_core_v1_1.toml``) layer the
# Codex-specific provider_options on top of these flat keys; fixture
# documents (``walking_skeleton``, ``icon_dense``, etc.) override
# ``provider = "mock"`` so they never invoke a real CLI.
provider = "codex-cli"
model_default = "gpt-5.5"
model_hard = "gpt-5.5"
fallback_provider = "gemini-cli"
fallback_model = "gemini-2.5-flash"
temperature = 0.0
batch_size = 24
prompt_profile = "translate_rules_ru.v1"
style_critic_enabled = true
style_critic_provider = ""          # empty = inherit translation.provider
style_critic_model = ""             # empty = inherit model_hard/model_default
style_critic_reasoning_effort = "high"
style_repair_enabled = true
style_repair_provider = ""          # empty = inherit critic/provider
style_repair_model = ""             # empty = inherit critic/model_hard/model_default
style_repair_reasoning_effort = "high"

[translation.hardness]
# Opt-in deterministic routing from model_default to model_hard. Keep disabled
# unless a document has calibrated the weights against representative pages.
enabled = false
threshold = 2.0
inline_icon_density_weight = 2.0
cross_reference_density_weight = 2.0
table_presence_weight = 1.0
segment_count_weight = 0.05
segment_length_weight = 0.001

# Provider-specific options live in the per-document config so the mock
# fixture documents that override ``provider = "mock"`` don't inherit
# Codex-specific knobs the factory would then reject under the
# "mock accepts no options" rule. See:
#
#   configs/documents/ato_core_v1_1.toml [translation.provider_options.cli]
#
# for the recommended Codex CLI block (reasoning_effort = "xhigh",
# sandbox = "read-only", approval_policy = "never", timeout_seconds = 600).

[structure]
heading_fonts = ["GreenleafLightPro", "Goobascript"]
decorative_fonts = ["GreenleafBannersRegularL"]
body_font = "Adonis-Regular"
bold_font = "Adonis-Bold"
italic_font = "Adonis-Italic"
bold_italic_font = "Adonis-BoldItalic"
dingbat_font = "ITCZapfDingbatsMedium"
footer_y_threshold = 790.0
heading_min_size = 8.0
subheading_bold_min_size = 10.0
body_size_min = 7.5
body_size_max = 10.0
paragraph_gap_factor = 1.5
paragraph_gap_abs = 12.0
figure_min_width_pt = 100.0
figure_min_height_pt = 100.0
gutter_min_width_pt = 10.0
full_width_fraction = 0.85
band_gap_min_pt = 15.0
furniture_top_max_y = 60.0
furniture_bottom_min_y = 750.0

[render]
facsimile_coverage_threshold = 0.15

[qa]
block_publish_on = ["error", "critical"]
