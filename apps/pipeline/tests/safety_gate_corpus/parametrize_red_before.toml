# --------------------------------------------------------------------------- #

[[case]]
id = "plain-function-body"
expect = "allow"
note = """the genuine fixture/data-extension carve-out: a list extended inside a
plain (undecorated) function body is NOT a parametrize vector."""
snippet = """
