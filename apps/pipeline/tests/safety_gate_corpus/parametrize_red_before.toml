# --------------------------------------------------------------------------- #
# block — S5U-650 named regressions: multiline bare-row miss + equivalent      #
# vector. The added rows carry NO decorator/call token on their own line, so   #
# the pre-S5U-650 line-grep silently passed them. The AST detector flags them   #
# by ENCLOSING CONTEXT. If the detector regressed to a line-grep these would    #
# return 0 matches and the harness would go red.                                #
# --------------------------------------------------------------------------- #

[[case]]
id = "S5U-650-multiline-row"
expect = "block"
note = """S5U-650 regression: a branch-extending tuple row `("new_case", expected),`
with no parametrize/.each/@given token on the added line. Pre-S5U-650 line-grep
missed it; the enclosing-context AST walk flags it."""
snippet = """
import pytest


@pytest.mark.parametrize('a,b', [
    (1, 2),
    ('new_case', 99),
])
def test_x(a, b):
    pass
"""

[[case]]
id = "S5U-650-given-multiline-row"
expect = "block"
note = """S5U-650 equivalent-vector regression: @given strategy widened across lines
where the added strategy lines contain NO `@given` token. Same enclosing-context
miss as the parametrize multiline row, on the hypothesis vector."""
snippet = """
from hypothesis import given, strategies as st


@given(
    st.one_of(
        st.integers(),
        st.text(),
        st.booleans(),
    )
)
def test_x(value):
    pass
"""

