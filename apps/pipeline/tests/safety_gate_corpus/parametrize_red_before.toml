"""

# --------------------------------------------------------------------------- #
# known_residual — vitest `.each` is out of scope for the `.py`-only AST        #
# detector. `_changed_python_files` filters to `*.py`, so a `.ts`/`.tsx` spec   #
# never reaches `analyze_file` in production; the reviewer prompt keeps a        #
# line-grep fallback for `.ts` whose multi-line `.each` token-outside-the-       #
# diff-window limitation is the documented residual (.claude/rules/hooks.md).   #
# Driven through `analyze_file` here the JS source is not valid Python and the   #
# detector stays SILENT (0 matches). Flip to `block` if/when a TS-AST detector   #
# lands. See S5U-789 for the cross-language rollout.                            #
# --------------------------------------------------------------------------- #

[[case]]
id = "S5U-650-vitest-each-multiline-out-of-scope"
expect = "known_residual"
note = """vitest multi-line test.each([...]) row addition. The `.py`-only AST
detector does not cover `.ts`; the reviewer line-grep fallback misses the
multi-line `.each` whose `.each(` token sits outside the diff window. Detector
stays silent (0 matches) — pinned so a future TS-AST upgrade can flip it."""
snippet = """
test.each([
  ['a', 1],
  ['b', 2],
])('case %s', (n, v) => {
  expect(n).toBe(v);
});
"""
