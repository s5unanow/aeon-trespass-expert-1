    cases = [
        1,
        2,
    ]
    assert cases == [1, 2]
"""

[[case]]
id = "fixture-no-params-not-flagged"
expect = "allow"
note = """false-positive guard: @pytest.fixture WITHOUT a params= kwarg is an
ordinary fixture, not a parametrized one — must not flag the body list."""
snippet = """
import pytest


@pytest.fixture
def my_fixture():
    data = [
        'a',
        'b',
    ]
    return data
"""

[[case]]
id = "mark-skipif-not-flagged"
expect = "allow"
note = """false-positive guard: @mark.skipif must NOT match. The detector's
`attr == 'parametrize'` clause keeps any other @mark.X decorator out."""
snippet = """
from pytest import mark


@mark.skipif(True, reason='nope')
def test_y():
    pass
"""

[[case]]
id = "parametrize-lookalike-custom-decorator"
