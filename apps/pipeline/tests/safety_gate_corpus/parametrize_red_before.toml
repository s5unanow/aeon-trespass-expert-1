# Named adversarial corpus for the parametrize red-before gate (S5U-819).
#
# Detector: scripts/check_parametrize_red_before.py
# Harness:  apps/pipeline/tests/unit/test_check_parametrize_red_before_corpus.py
# Coverage: scripts/check_detector_corpus_coverage.py (a change to any
#           `detector_sources` file with no change to THIS file fails CI).
#
# This corpus is the CONTRACT (S5U-789). Reviewer-found syntactic bypasses are
# added here as `block` cases — NOT patched in as one-off regexes. The detector
# implementation (an enclosing-context AST walk today) must satisfy every case.
#
# The detector's production entry point is `analyze_file(path, head_source,
# added_lines) -> (matches, skips)`. The harness drives it over each snippet as
# the head source with EVERY non-blank line treated as an added line (the whole
# snippet is "the diff"). Semantics per `expect`:
#   block          — the detector MUST flag this (>=1 Match) with NO parse Skip
#                    (a Skip on a `block`/`allow` case is a corpus typo, caught).
#   allow          — the detector MUST NOT flag this (0 Match, 0 Skip).
#   known_residual — the detector does NOT flag this today; the harness asserts
#                    0 Match so a future detector upgrade that closes the residual
#                    surfaces here and the case can flip to `block`.
#
# Vector coverage (S5U-819 §4): pytest `@parametrize`, the `@mark.parametrize`
# and bare `@parametrize` import-alias renames (Rule G2), class-level and stacked
# decorators, `@pytest.fixture(params=...)`, hypothesis `@given`,
# `pytest_generate_tests`, the S5U-650 multiline bare-row miss (block regression),
# and the vitest `.each` `.ts` out-of-scope residual (known_residual).

policy = "parametrize_red_before"
detector_sources = ["scripts/check_parametrize_red_before.py"]

# --------------------------------------------------------------------------- #
# block — canonical pytest parametrize surfaces                               #
# --------------------------------------------------------------------------- #

[[case]]
id = "pytest-mark-parametrize-row"
expect = "block"
note = "canonical @pytest.mark.parametrize row addition"
snippet = """
import pytest


@pytest.mark.parametrize('a,b', [
    (1, 2),
    (3, 4),
])
def test_x(a, b):
    pass
"""

[[case]]
id = "mark-parametrize-alias"
expect = "block"
note = """Rule G2 rename/alias: `from pytest import mark; @mark.parametrize(...)`.
Same behavior as the canonical form reached through a different import name —
content-derived AST match, not a hardcoded decorator-name string (S5U-758)."""
snippet = """
from pytest import mark


@mark.parametrize('a,b', [
    (1, 2),
    (3, 4),
])
def test_x(a, b):
    pass
"""

[[case]]
id = "bare-parametrize-alias"
expect = "block"
note = """Rule G2 alias: `from pytest.mark import parametrize; @parametrize(...)`.
The bare-Name decorator form."""
snippet = """
