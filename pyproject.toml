[project]
name = "aeon-trespass-expert"
version = "0.1.0"
description = "IR-first document compiler for Aeon Trespass rulebook translation"
requires-python = ">=3.12"
readme = "README.md"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/schemas/python",
  "apps/pipeline",
]

[tool.uv.sources]
atr-schemas = { workspace = true }
atr-pipeline = { workspace = true }

[dependency-groups]
dev = [
  "atr-schemas",
  "atr-pipeline",
  "ruff>=0.9",
  "mypy>=1.14",
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "pytest-timeout>=2.3",
  "pre-commit>=4.0",
  "import-linter>=2.11",
  "jsonschema>=4.23",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/pipeline/src", "packages/schemas/python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C901", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 7
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# Tracked by S5U-144 (Epic 3: Config-driven structure recovery)
"apps/pipeline/src/atr_pipeline/stages/structure/real_block_builder.py" = ["C901", "PLR0912", "PLR0915"]
# Tracked by S5U-143 (Epic 2: Expand QA — translation planner complexity)
"apps/pipeline/src/atr_pipeline/stages/translation/planner.py" = ["C901", "PLR0912"]
# S5U-697: bilingual EN/RU test fixtures necessarily contain Cyrillic
# letters that visually collide with ASCII (H/Н, B/В, a/а, o/о). Allowing
# RUF001 in this test module lets the test data match the production
# p0007 pairings verbatim.
"apps/pipeline/tests/unit/stages/render/test_annotation_mapping.py" = ["RUF001"]
# S5U-776: ensemble translation POC carries Cyrillic glossary,
# forbidden-phrase, and few-shot data inline. Ambiguous-character lints
# (RUF001 strings, RUF003 comments) fire on every Russian token and add
# no value here.
"scripts/translation_eval/rules.py" = ["RUF001", "RUF003"]
"scripts/translation_eval/prompts.py" = ["RUF001", "RUF003"]
"scripts/translation_eval/qa_checks.py" = ["RUF001", "RUF003"]
"scripts/translation_eval/report.py" = ["RUF001"]
"apps/pipeline/tests/unit/test_translation_eval_qa_checks.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["atr_pipeline", "atr_schemas"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "fitz.*", "docling.*", "cv2.*", "paddleocr.*",
    "PIL", "PIL.*",
    "openai", "openai.*",
    "anthropic", "anthropic.*",
    "google", "google.genai", "google.genai.*",
    "yaml", "yaml.*",
]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["atr_pipeline"]

[[tool.importlinter.contracts]]
name = "Pipeline layer contract"
type = "layers"
layers = [
    "atr_pipeline.cli",
    "atr_pipeline.runner",
    "atr_pipeline.stages | atr_pipeline.eval",
    "atr_pipeline.services | atr_pipeline.store | atr_pipeline.registry",
    "atr_pipeline.config",
    "atr_pipeline.utils",
]
# stages → runner.stage_context is intentional: stages need the runtime context
# dataclass, but must not import orchestration logic (executor, registry, plan).
# stages.structure → eval.confidence_scorer is intentional: the structure stage
# calls the deterministic scorer to compute ConfidenceMetrics in production.
# stages.qa → eval.confidence_policy is intentional: the QA stage loads the
# versioned confidence-band policy and routes pages by it.
# stages.qa.render_binding → runner.stage_context is intentional (S5U-1264): the
# run-id-bound render resolver needs the runtime context (run_id + registry_conn)
# to read the current run's render stage event, mirroring the qa/publish stages.
# services.pdf.raster_provider → store.artifact_store is intentional: the raster
# provider bridges rendering (service) and content-addressed storage (store).
ignore_imports = [
    "atr_pipeline.stages.structure.stage -> atr_pipeline.eval.confidence_scorer",
    "atr_pipeline.stages.qa.stage -> atr_pipeline.eval.confidence_policy",
    "atr_pipeline.stages.qa.rules.confidence_band_rule -> atr_pipeline.eval.confidence_policy",
    "atr_pipeline.stages.qa.render_binding -> atr_pipeline.runner.stage_context",
    "atr_pipeline.services.pdf.raster_provider -> atr_pipeline.store.artifact_store",
    "atr_pipeline.stages.ingest.stage -> atr_pipeline.runner.stage_context",
    "atr_pipeline.stages.extract_native.stage -> atr_pipeline.runner.stage_context",
    "atr_pipeline.stages.extract_layout.stage -> atr_pipeline.runner.stage_context",
    "atr_pipeline.stages.symbols.stage -> atr_pipeline.runner.stage_context",
    "atr_pipeline.stages.structure.stage -> atr_pipeline.runner.stage_context",
    "atr_pipeline.stages.translation.stage -> atr_pipeline.runner.stage_context",
    "atr_pipeline.stages.render.stage -> atr_pipeline.runner.stage_context",
    "atr_pipeline.stages.qa.stage -> atr_pipeline.runner.stage_context",
    "atr_pipeline.stages.publish.stage -> atr_pipeline.runner.stage_context",
    "atr_pipeline.stages.assistant.stage -> atr_pipeline.runner.stage_context",
]

[tool.pytest.ini_options]
testpaths = ["apps/pipeline/tests"]
addopts = "-ra -q"
markers = [
    "slow: marks tests as slow (skipped by pre-commit hook)",
    "codex_live: marks tests that shell out to a real `codex` CLI; opt-in only via the ATR_CODEX_LIVE_SMOKE=1 env var",
]
