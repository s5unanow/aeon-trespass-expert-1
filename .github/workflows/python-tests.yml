name: Python Tests

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # S5U-642: full history is required for the threshold-loosening
          # guard and the extraction-scope detector to diff against the PR
          # base branch. Shallow checkouts cause `git diff` and `git show`
          # against `origin/<base_ref>` to silently return empty, which
          # made the threshold guard fail-open for real loosening PRs.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy apps/pipeline/src packages/schemas/python

      - name: Import layer contracts
        run: uv run lint-imports

      - name: File length check
        run: uv run python scripts/check_file_length.py

      - name: Install Node (for TS codegen check)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm && pnpm install

      - name: Check codegen freshness
        run: bash scripts/check_codegen_fresh.sh

      - name: Validate fixture manifest
        run: uv run python scripts/validate_fixture_manifest.py

      - name: Detect extraction scope
        id: extraction-scope
        if: github.event_name == 'pull_request'
        run: |
          uv run python scripts/check_extraction_scope.py \
            --base origin/${{ github.base_ref || 'main' }} --head HEAD \
            --output-json /tmp/extraction-scope.json

      - name: Golden refresh guard
        if: github.event_name == 'pull_request' && steps.extraction-scope.outputs.golden_refresh_detected == 'true'
        run: |
          uv run python scripts/check_golden_refresh.py \
            --base origin/${{ github.base_ref || 'main' }} --head HEAD

      # S5U-591: block silent threshold loosening. Runs on every PR
      # unconditionally (S5U-642 decoupled this from the extraction-scope
      # detector — relying on `threshold_change_detected` created a
      # fail-open path when a shallow checkout caused the detector to see
      # zero changed files). The guard itself short-circuits cleanly when
      # thresholds.toml is unchanged or absent on both sides.
      # The PR body is passed so a `## Threshold loosening justification`
      # section can unblock the check without requiring a commit-message
      # sentinel. Fails CI if loosening is detected without either form
      # of justification. See docs/EXTRACTION_IMPLEMENTATION_PLAYBOOK.md §8.3.
      - name: Threshold loosening guard
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr_body.md
          uv run python scripts/check_threshold_changes.py \
            --base origin/${{ github.base_ref || 'main' }} --head HEAD \
            --pr-body-file /tmp/pr_body.md

      - name: Test
        run: uv run pytest --tb=short

      - name: Code erosion report (advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          uv run python scripts/check_code_erosion.py \
            --base origin/${{ github.base_ref || 'main' }} --head HEAD \
            --output-json /tmp/erosion-report.json
