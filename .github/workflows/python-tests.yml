name: Python Tests

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # S5U-642: full history is required for the threshold-loosening
          # guard and the extraction-scope detector to diff against the PR
          # base branch. Shallow checkouts cause `git diff` and `git show`
          # against `origin/<base_ref>` to silently return empty, which
          # made the threshold guard fail-open for real loosening PRs.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy apps/pipeline/src packages/schemas/python

      - name: Import layer contracts
        run: uv run lint-imports

      - name: File length check
        run: uv run python scripts/check_file_length.py

      # S5U-658: scan *.md for stale check-count claims, retired-term
      # references, and duplicated safety-gate-scope enumerations. Wired
      # as a step inside `python / test` (no new branch-protection
      # context) — fail-closed on missing authoritative sources.
      - name: Instruction drift check
        run: uv run python scripts/check_instruction_drift.py

      # S5U-690: fail CI when the `make lint` recipe in Makefile drifts
      # from the one-line summary documented in CLAUDE.md and load-bearing
      # templates. Wired inside `python / test` (no new branch-protection
      # context) — fail-closed on missing Makefile/CLAUDE.md/template.
      - name: Make/doc parity check
        run: uv run python scripts/check_make_doc_parity.py

      - name: Install Node (for TS codegen check)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm && pnpm install

      - name: Check codegen freshness
        run: bash scripts/check_codegen_fresh.sh

      - name: Validate fixture manifest
        run: uv run python scripts/validate_fixture_manifest.py

      - name: Detect extraction scope
        id: extraction-scope
        if: github.event_name == 'pull_request'
        run: |
          uv run python scripts/check_extraction_scope.py \
            --base origin/${{ github.base_ref || 'main' }} --head HEAD \
            --output-json /tmp/extraction-scope.json

      - name: Golden refresh guard
        if: github.event_name == 'pull_request' && steps.extraction-scope.outputs.golden_refresh_detected == 'true'
        run: |
          uv run python scripts/check_golden_refresh.py \
            --base origin/${{ github.base_ref || 'main' }} --head HEAD

      # S5U-591: block silent threshold loosening. Runs on every PR
      # unconditionally (S5U-642 decoupled this from the extraction-scope
      # detector — relying on `threshold_change_detected` created a
      # fail-open path when a shallow checkout caused the detector to see
      # zero changed files). The guard itself short-circuits cleanly when
      # thresholds.toml is unchanged or absent on both sides.
      # The PR body is passed so a `## Threshold loosening justification`
      # section can unblock the check without requiring a commit-message
      # sentinel. Fails CI if loosening is detected without either form
      # of justification. See docs/EXTRACTION_IMPLEMENTATION_PLAYBOOK.md §8.3.
      - name: Threshold loosening guard
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr_body.md
          uv run python scripts/check_threshold_changes.py \
            --base origin/${{ github.base_ref || 'main' }} --head HEAD \
            --pr-body-file /tmp/pr_body.md

      - name: Test
        run: uv run pytest --tb=short

      # S5U-673: exercise the pre-PR safety-gate hook end-to-end. Hermetic
      # (no network, no secrets): mocks `gh` via PATH and drives the real
      # .claude/hooks/pre-pr-check.sh against the current branch. Failure
      # of any fixture case (regex / base-ref resolution / coordinator-ack
      # filter / env-var-surface structural checks) fails this job. The
      # test auto-stashes a pre-existing tmp/review-<issue>.md and
      # restores it on exit so it does not interfere with reviewer state.
      # Piggybacks on `python / test` rather than adding a new required
      # context — see tmp/plan-s5u-673.md §6.
      #
      # HARNESS_BRANCH_OVERRIDE is passed so the harness resolves the PR
      # source branch correctly when actions/checkout leaves HEAD detached.
      # For push events, github.head_ref is empty and the harness falls back
      # to `git rev-parse --abbrev-ref HEAD` (which on main is 'main',
      # triggering the no-safety-gate-diff skip branch).
      # S5U-691: pipe through `tee` and assert `ALL TESTS PASSED` is present.
      # The previous invocation (`run: bash scripts/test_pre_pr_safety_gate.sh`)
      # conflated silent-crash ("process completed with exit code 1" with no
      # output) with an actual test failure. Adding the `grep -q "ALL TESTS
      # PASSED"` postcondition surfaces silent exits immediately.
      # `set -o pipefail` preserves the harness's exit code through `tee`.
      - name: Pre-PR safety gate harness
        env:
          HARNESS_BRANCH_OVERRIDE: ${{ github.head_ref }}
        run: |
          set -o pipefail
          bash scripts/test_pre_pr_safety_gate.sh 2>&1 | tee /tmp/harness.log
          grep -q "ALL TESTS PASSED" /tmp/harness.log

      # S5U-691: regression test simulating main-branch post-merge CI. Clones
      # the repo to an ephemeral worktree, checks out main, runs the harness,
      # and asserts the SKIP banner + `ALL TESTS PASSED`. Per
      # .claude/rules/guards.md Rule G1, this is the shallow-checkout /
      # missing-state coverage the harness lacked in S5U-673.
      - name: Pre-PR safety gate harness — main-branch skip regression
        run: bash scripts/test_harness_skip_on_main.sh

      - name: Code erosion report (advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          uv run python scripts/check_code_erosion.py \
            --base origin/${{ github.base_ref || 'main' }} --head HEAD \
            --output-json /tmp/erosion-report.json
