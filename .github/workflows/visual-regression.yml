name: Visual Regression

on:
  workflow_call:

# Prevent stale-run races: if a newer commit arrives on the same ref while an
# older visual-regression run is still queued or running, cancel the older one
# so only the latest HEAD's result ever writes a required-check status.
# S5U-1224: the cancel is now guarded so it NEVER fires on a `main` push run —
# the required main-HEAD-green merge check (CLAUDE.md step 9) and the post-merge
# coordinator-ack audit (S5U-693) both depend on main runs completing. On main,
# `github.ref == 'refs/heads/main'` so the expression is false (no cancel); on
# PR/feature refs it is true (supersede stale runs). The group stays keyed on
# `github.ref` (distinct from ci.yml's `ci-` group), so parent and child can
# never cancel across each other.
concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # S5U-1224: pnpm/action-setup runs BEFORE setup-node so pnpm is on PATH
      # when `cache: 'pnpm'` resolves the store path (documented ordering).
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # S5U-1224: cache the Chromium download keyed on the resolved
      # @playwright/test version. A version bump rolls the key automatically, so
      # a stale browser is never paired with a new runner (which would produce
      # flaky visual diffs). On a cache MISS the next step downloads exactly as
      # today; on a HIT it re-verifies/installs OS deps quickly. The gate's
      # correctness never depends on a hit (pure speedup).
      - name: Resolve Playwright version
        id: pw
        working-directory: apps/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        run: pnpm --filter @atr/web exec playwright install --with-deps chromium

      - name: Build
        run: pnpm --filter @atr/web run build

      # Defense in depth. The primary check is `visual-gate-scope / scan`
      # (a separate job in `ci.yml`) which scans all workflows and scripts.
      # This job-local guard keeps a fail-fast check right next to the
      # Playwright invocation. See `scripts/check_test_e2e_flags.sh` and
      # S5U-608 for the full threat model (flag enumeration intentionally
      # not inlined here to avoid tripping the visual-gate-scope scanner).
      - name: Guard against in-CI baseline regeneration
        run: bash scripts/check_test_e2e_flags.sh

      # S5U-657: implements bullet 4 of S5U-608's fix sketch — block
      # per-test `maxDiffPixelRatio` overrides without an adjacent
      # `// visual-gate-override: allow reason=<...>` comment. Wired
      # as a job-step inside the already-required `visual-regression /
      # visual` job; no branch-protection edit needed.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Block unjustified per-test maxDiffPixelRatio overrides
        run: python scripts/check_visual_test_overrides.py apps/web/tests/e2e

      - name: Run e2e and visual regression tests
        # CI=true (set by GitHub Actions automatically) makes Playwright fail
        # when a baseline PNG is missing instead of silently creating one.
        run: pnpm --filter @atr/web run test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 14
