name: Check File-Length Violators Live

# Meta-mitigation for the S5U-663 → S5U-669 drift class: every
# scripts/check_file_length.py:KNOWN_VIOLATORS value must resolve to an
# open Linear issue (state_type NOT in {completed, canceled}). If an
# umbrella tracker issue is marked Done before its 12 files are split,
# this gate flags it.
#
# Advisory on first iteration — NOT wired to branch protection's
# required_status_checks.contexts. Promote later once false-positive
# rate is characterized. See `tmp/plan-s5u-669.md` §4c.
#
# Secret: LINEAR_API_KEY must be configured in the repo Actions secrets.
# Without it, the script fails CLOSED (this job red). Because the job is
# advisory, a red result does not block merges — the reviewer reads it.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: check-file-length-violators-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  scan:
    name: "check-file-length-violators / scan"
    runs-on: ubuntu-latest
    # Advisory — the job can fail without blocking the PR. Once branch
    # protection is updated to include this check (follow-up issue),
    # remove this line.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pure stdlib script (urllib.request, json, dataclasses). No uv/pip
      # install needed — keeps the job fast (~5 s end-to-end even with
      # 3 unique Linear IDs to fetch).

      - name: Validate KNOWN_VIOLATORS Linear citations
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          python scripts/check_file_length_violators_live.py
